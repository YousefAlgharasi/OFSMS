<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>لا يوجد اتصال — نظام نماء</title>
  <style>
    body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f0f4f8;font-family:Tahoma,Arial,sans-serif;color:#0d3d5c;padding:1rem;box-sizing:border-box}
    .card{max-width:420px;background:#fff;border:1px solid #e5eaf0;border-radius:1rem;padding:2rem;text-align:center;box-shadow:0 4px 18px rgba(27,94,140,.08)}
    h1{font-size:1.2rem;margin:0 0 .6rem}
    p{margin:0 0 1.2rem;line-height:1.8;color:#475569;font-size:.92rem}
    a,button{display:inline-block;margin:.25rem;padding:.6rem 1.2rem;border-radius:.6rem;border:0;background:#1B5E8C;color:#fff;font-size:.9rem;font-weight:700;text-decoration:none;cursor:pointer;font-family:inherit}
    .where{margin:1rem 0 0;font-size:.7rem;color:#94a3b8;word-break:break-all}
    a.alt{background:#e8f1f8;color:#1B5E8C}
  </style>
</head>
<body>
  <div class="card">
    <h1>لا يوجد اتصال بالإنترنت</h1>
    <p>هذه الصفحة لم تُحفظ على جهازك بعد. افتحها مرة واحدة أثناء وجود الإنترنت لتصبح متاحة دون اتصال.</p>
    <button onclick="location.reload()">إعادة المحاولة</button>
    <a class="alt" href="/dashboard">الصفحة الرئيسية</a>
    <p class="where" id="where" dir="ltr"></p>
  </div>
  <script>
    // Which address could not be shown (helps support); also try again by itself when the connection returns
    document.getElementById('where').textContent = location.host + location.pathname;
    window.addEventListener('online', function () { location.reload(); });
  </script>
</body>
</html>
