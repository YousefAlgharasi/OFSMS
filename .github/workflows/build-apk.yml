name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      site_url:
        description: 'Deployed web app URL (https://...)'
        required: true
        type: string

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Create Capacitor Android project
        working-directory: apps/mobile
        env:
          SITE_URL: ${{ inputs.site_url }}
        run: |
          npm init -y >/dev/null
          # Filesystem + Share: used to save / share exported PDF and Excel files
          npm i @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/filesystem@6 @capacitor/share@6
          mkdir -p www
          echo '<!doctype html><title>OFSMS</title>' > www/index.html
          # Shown when the app is opened offline before it has ever been opened online
          cp ../frontend/public/offline.html www/offline.html
          cat > capacitor.config.json <<JSON
          {
            "appId": "org.namaa.ofsms",
            "appName": "نظام نماء",
            "webDir": "www",
            "server": { "url": "$SITE_URL", "cleartext": false, "errorPath": "offline.html" },
            "android": { "allowMixedContent": false }
          }
          JSON
          npx cap add android
          # Launcher icons from the logo (plain PNGs; drop the adaptive-icon XMLs that need extra resources)
          RES=android/app/src/main/res
          rm -rf $RES/mipmap-anydpi-v26
          python3 -m pip install -q pillow
          python3 - <<'PY'
          from PIL import Image
          import os
          res = 'android/app/src/main/res'
          logo = Image.open('../frontend/public/logo.png').convert('RGBA')
          for dens, px in {'mdpi': 48, 'hdpi': 72, 'xhdpi': 96, 'xxhdpi': 144, 'xxxhdpi': 192}.items():
              d = os.path.join(res, 'mipmap-' + dens)
              os.makedirs(d, exist_ok=True)
              for name in ('ic_launcher', 'ic_launcher_round', 'ic_launcher_foreground'):
                  logo.resize((px, px), Image.LANCZOS).save(os.path.join(d, name + '.png'))
          PY
          npx cap sync android

      - name: Build debug APK
        working-directory: apps/mobile/android
        run: ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: ofsms-apk
          path: apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
